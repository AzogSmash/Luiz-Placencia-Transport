<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "dorado",
  "fontPair": "playfair-inter",
  "buttonShape": "soft",
  "density": "comfortable"
}/*EDITMODE-END*/;

const ACCENTS = {
  dorado:  { val: "oklch(0.78 0.09 85)",   soft: "oklch(0.78 0.09 85 / 0.15)" },
  azul:    { val: "oklch(0.62 0.10 240)",  soft: "oklch(0.62 0.10 240 / 0.18)" },
  plata:   { val: "oklch(0.82 0.012 240)", soft: "oklch(0.82 0.012 240 / 0.15)" },
  cobre:   { val: "oklch(0.66 0.11 50)",   soft: "oklch(0.66 0.11 50 / 0.18)" },
};

const FONT_PAIRS = {
  "cormorant-inter": { display: '"Cormorant Garamond", Georgia, serif', sans: '"Inter", sans-serif', label: "Cormorant + Inter" },
  "playfair-inter":  { display: '"Playfair Display", Georgia, serif',  sans: '"Inter", sans-serif', label: "Playfair + Inter" },
  "inter-only":      { display: '"Inter", sans-serif',                 sans: '"Inter", sans-serif', label: "Inter (mono)" },
};

const SHAPES = { angular: "2px", soft: "10px", pill: "999px" };
const DENSITIES = { comfortable: { pad: 1, container: 1320 }, airy: { pad: 1.25, container: 1320 }, compact: { pad: 0.78, container: 1240 } };

function App() {
  const [page, setPage] = React.useState("home");
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply tweaks to root vars
  React.useEffect(() => {
    const r = document.documentElement.style;
    const acc = ACCENTS[tweaks.accent] || ACCENTS.dorado;
    r.setProperty("--accent", acc.val);
    r.setProperty("--accent-soft", acc.soft);
    const fp = FONT_PAIRS[tweaks.fontPair] || FONT_PAIRS["cormorant-inter"];
    r.setProperty("--display", fp.display);
    r.setProperty("--sans", fp.sans);
    r.setProperty("--radius", SHAPES[tweaks.buttonShape] || "2px");
    const d = DENSITIES[tweaks.density] || DENSITIES.comfortable;
    r.setProperty("--pad", d.pad);
    r.setProperty("--container", d.container + "px");
  }, [tweaks]);

  // Scroll to top on page change
  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: "instant" });
  }, [page]);

  const renderPage = () => {
    switch (page) {
      case "servicios": return <ServiciosPage setPage={setPage} />;
      case "reserva":   return <ReservaPage setPage={setPage} />;
      case "contacto":  return <ContactoPage setPage={setPage} />;
      default:          return <HomePage setPage={setPage} />;
    }
  };

  return (
    <div data-screen-label={`${page === "home" ? "01 Inicio" : page === "servicios" ? "02 Servicios" : page === "reserva" ? "03 Reserva" : "04 Contacto"}`} key={page}>
      <NavBar page={page} setPage={setPage} />
      {renderPage()}
      <Footer setPage={setPage} />
      <WhatsAppFAB />

      <TweaksPanel title="Tweaks" defaultOpen={false}>
        <TweakSection title="Color de acento">
          <TweakRadio
            value={tweaks.accent}
            onChange={v => setTweak("accent", v)}
            options={[
              { value: "dorado", label: "Dorado" },
              { value: "azul",   label: "Azul" },
              { value: "plata",  label: "Plata" },
              { value: "cobre",  label: "Cobre" },
            ]}
          />
        </TweakSection>

        <TweakSection title="Tipografía">
          <TweakSelect
            value={tweaks.fontPair}
            onChange={v => setTweak("fontPair", v)}
            options={Object.entries(FONT_PAIRS).map(([k, v]) => ({ value: k, label: v.label }))}
          />
        </TweakSection>

        <TweakSection title="Forma de botones">
          <TweakRadio
            value={tweaks.buttonShape}
            onChange={v => setTweak("buttonShape", v)}
            options={[
              { value: "angular", label: "Angular" },
              { value: "soft",    label: "Suave" },
              { value: "pill",    label: "Píldora" },
            ]}
          />
        </TweakSection>

        <TweakSection title="Densidad">
          <TweakRadio
            value={tweaks.density}
            onChange={v => setTweak("density", v)}
            options={[
              { value: "compact",     label: "Compacto" },
              { value: "comfortable", label: "Cómodo" },
              { value: "airy",        label: "Aireado" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
